# ============= 城市子域名矩阵 (*.openai2000.cn) ==============
# HTTP -> HTTPS
server {
    listen 80;
    server_name ~^(?!www\.)(?!dazi\.)(?!pay\.)(?!api\.)(?!openai2000\.)(?<subdomain>.+)\.openai2000\.cn$;
    return 301 https://$subdomain.openai2000.cn$request_uri;
}

# HTTPS - Bot -> static SEO pages, Browser -> SPA
server {
    listen 443 ssl http2;
    server_name ~^(?!www\.)(?!dazi\.)(?!pay\.)(?!api\.)(?!openai2000\.)(?<subdomain>.+)\.openai2000\.cn$;
    ssl_certificate     /etc/letsencrypt/live/openai2000.cn-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openai2000.cn-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    root /data/web/huizhiyunma/frontend/dist;
    index index.html;

    # Bot detection
    set $is_bot "";
    if ($http_user_agent ~* "Baiduspider|Baiduspider-render|Sogou web spider|Sogou inst spider|360spider|YisouSpider|Googlebot|bingbot|Bytespider|YandexBot|facebookexternalhit|Twitterbot|WhatsApp|Line|TelegramBot|slurp|DuckDuckBot|Baiduspider-image|Sogou|sogou|baiduboxapp") {
        set $is_bot "1";
    }

    # Static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
    }

    # Uploads
    location /uploads/ {
        alias /data/web/huizhiyunma/uploads/;
        expires 30d;
    }

    # All routes
    location / {
        if ($is_bot = "1") {
            rewrite ^/$ /city/$subdomain/index.html break;
            rewrite ^/services/?$ /city/$subdomain/services.html break;
            rewrite ^/cases/?$ /city/$subdomain/cases.html break;
            rewrite ^/about/?$ /city/$subdomain/about.html break;
            rewrite ^/templates/?$ /city/$subdomain/templates.html break;
            rewrite ^/packages/?$ /city/$subdomain/packages.html break;
            rewrite ^/articles/?$ /city/$subdomain/articles.html break;
            rewrite ^/contact/?$ /city/$subdomain/contact.html break;
            rewrite ^/cases/([0-9]+)/?$ /city/$subdomain/cases/$1.html break;
            rewrite ^/articles/([0-9]+)/?$ /city/$subdomain/articles/$1.html break;
        }
        # Browser: SPA with city SEO meta tags
        try_files $uri $uri/ /city/$subdomain/spa_index.html;
    }
}

# ============= HTTP 入口（80）=============
server {
    listen 80;
    server_name openai2000.cn www.openai2000.cn;
    if ($host !~ ^(openai2000\.cn|www\.openai2000\.cn)$) { return 403; }
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ============= HTTPS 主站（443）=============
server {
    listen 443 ssl http2;
    server_name openai2000.cn www.openai2000.cn;
    if ($host !~ ^(openai2000\.cn|www\.openai2000\.cn)$) { return 403; }
    if ($host = 'www.openai2000.cn') { return 301 https://openai2000.cn$request_uri; }
    # Baidu verification file
    location = /baidu_verify_codeva-geushDpNvl.html {
        alias /data/web/huizhiyunma/frontend/dist/baidu_verify_codeva-geushDpNvl.html;
    }
    ssl_certificate     /etc/letsencrypt/live/openai2000.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openai2000.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    root /data/web/huizhiyunma/frontend/dist;
    index index.html;
    # index.html 禁用缓存：防微信 WebView 缓存旧版页面（支付流程强依赖新版 JS）
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, max-age=0";
        expires 0;
    }
    # 搜索引擎爬虫 → 静态 SEO 版
    set $is_bot "";
    if ($http_user_agent ~* "Baiduspider|Baiduspider-render|Sogou web spider|Sogou inst spider|360spider|YisouSpider|Googlebot|bingbot|Bytespider|YandexBot|facebookexternalhit|Twitterbot|WhatsApp|Line|TelegramBot|slurp|DuckDuckBot|Baiduspider-image|Sogou|sogou|baiduboxapp") {
        set $is_bot "1";
    }
    location / {
        if ($is_bot = "1") {
            rewrite ^/$ /index.seo.html break;
            rewrite ^/services/?$ /services.html break;
            rewrite ^/cases/?$ /cases.html break;
            rewrite ^/about/?$ /about.html break;
            rewrite ^/templates/?$ /templates.html break;
            rewrite ^/packages/?$ /packages.html break;
            rewrite ^/articles/?$ /articles.html break;
            rewrite ^/contact/?$ /contact.html break;
            rewrite ^/cases/([0-9]+)/?$ /seo/cases/$1.html break;
            # 行业解决方案页面
            rewrite ^/solutions/?$ /solutions/index.html break;
            rewrite ^/solutions/([a-z]+)/?$ /solutions/$1.html break;
            rewrite ^/articles/([0-9]+)/?$ /seo/articles/$1.html break;
        }
        # Browser: serve page-specific SPA with correct SEO meta tags
        rewrite ^/services/?$ /services_spa.html break;
        rewrite ^/cases/?$ /cases_spa.html break;
        rewrite ^/about/?$ /about_spa.html break;
        rewrite ^/templates/?$ /templates_spa.html break;
        rewrite ^/packages/?$ /packages_spa.html break;
        rewrite ^/articles/?$ /articles_spa.html break;
        rewrite ^/contact/?$ /contact_spa.html break;
        rewrite ^/articles/([0-9]+)/?$ /articles/$1/spa_index.html break;
        rewrite ^/cases/([0-9]+)/?$ /cases/$1/spa_index.html break;
        # 已知路由：返回SPA页面
        rewrite ^/solutions/?$ /solutions/index.html break;
        rewrite ^/solutions/([a-z]+)/?$ /solutions/$1.html break;
        rewrite ^/login/?$ /index.html break;
        rewrite ^/register/?$ /index.html break;
        rewrite ^/profile/?$ /index.html break;
        rewrite ^/admin/?$ /index.html break;
        # 未知路由：返回404
        try_files $uri $uri/ =404;
    }
    location = /404.html { root /data/web/huizhiyunma/frontend/dist; internal; }
    location /api/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 20M; }
    location /uploads/ {
        alias /data/web/huizhiyunma/uploads/;
        expires 30d;
        # 安全加固：禁止公开下载备份/敏感文件
        location ~*\.(tar\.gz|tgz|sql|bak|zip|gz)$ {
            deny all;
        }
    }
    # 下载目录（临时文件分享）
    location /downloads/ {
        alias /var/www/downloads/;
        index index.html;
        add_header Content-Disposition "attachment";
    }
    location /templates/demo/ { alias /data/web/huizhiyunma/templates-demo/; }
    location /bt/ { proxy_pass http://127.0.0.1:30551/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_redirect http://127.0.0.1:30551/ /bt/; }
    location /bt/static/ { alias /www/server/panel/BTPanel/static/; expires 7d; }
}

# ============= dazi.openai2000.cn（同途搭子）=============
server {
    listen 443 ssl http2;
    server_name dazi.openai2000.cn;
    ssl_certificate     /etc/letsencrypt/live/dazi.openai2000.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dazi.openai2000.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_req zone=api burst=50 nodelay;
    limit_conn ttdazi_conn 100;
    location /pay {
        proxy_pass https://42.193.113.230:443;
        proxy_ssl_server_name on;
        proxy_ssl_name pay.openai2000.cn;
        proxy_set_header Host pay.openai2000.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    root /home/ubuntu/ttdazi-frontend;
    index index.html;
    location /socket.io/ { proxy_pass https://42.193.113.230:443;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai2000.cn; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /api/ { proxy_pass https://42.193.113.230:443;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai2000.cn; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    location /uploads/ { proxy_pass https://42.193.113.230:443;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai2000.cn; expires 7d; }
 
    # ──────────── 密码保护的备份下载 ────────────
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; add_header Access-Control-Allow-Origin "*" always; }
    location /backup/ {
        alias /data/disk/backups/;
        index index.html;
        autoindex_localtime on;
        auth_basic "备份文件下载";
        auth_basic_user_file /etc/nginx/backup-auth/.htpasswd;
        expires off;
        add_header Cache-Control "no-store";
    }
    location = /landing { rewrite ^ /landing.html break; }
    location = /landing/ { rewrite ^ /landing.html break; }
    location / { try_files $uri $uri/ /index.html; }
}

